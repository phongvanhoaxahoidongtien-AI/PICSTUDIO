<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="lens" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#accent)" stroke-width="6" opacity="0.3"/>
  <circle cx="256" cy="256" r="140" fill="#090d16" stroke="url(#accent)" stroke-width="12" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="100" fill="url(#lens)" opacity="0.9"/>
  <!-- Aperture blades -->
  <path d="M256 160 L320 220 L280 270 Z" fill="#0f172a" opacity="0.4"/>
  <path d="M352 256 L292 320 L242 280 Z" fill="#0f172a" opacity="0.4"/>
  <path d="M256 352 L192 292 L232 242 Z" fill="#0f172a" opacity="0.4"/>
  <path d="M160 256 L220 192 L270 232 Z" fill="#0f172a" opacity="0.4"/>
  <!-- Glare reflections -->
  <ellipse cx="220" cy="210" rx="42" ry="24" transform="rotate(-35 220 210)" fill="#ffffff" opacity="0.4"/>
  <circle cx="300" cy="290" r="12" fill="#ffffff" opacity="0.3"/>
  <!-- Sparkles -->
  <polygon points="380,110 388,126 404,134 388,142 380,158 372,142 356,134 372,126" fill="#38bdf8"/>
  <polygon points="120,380 125,392 137,397 125,402 120,414 115,402 103,397 115,392" fill="#f43f5e"/>
</svg>
